[project]
name = "ares-optimizer"
version = "1.1.0"
description = "Deterministic task classification, retrieval, and model routing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Khyri Williams (Kai)"}]
keywords = ["ai", "routing", "retrieval", "fastapi", "orchestration"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
